<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wallet</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}

.header{
  background:#1769aa;
  color:white;
  padding:18px;
}

.header h2{
  margin:0 0 5px;
}

.container{
  max-width:600px;
  margin:auto;
  padding:18px;
}

.balance{
  background:linear-gradient(135deg,#135ed0,#1769aa);
  color:white;
  padding:25px;
  border-radius:18px;
  margin-bottom:18px;
}

.balance h1{
  margin:8px 0 0;
}

.card{
  background:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:16px;
  box-shadow:0 3px 12px #ddd;
}

button{
  width:100%;
  border:0;
  padding:15px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  margin-top:10px;
}

.kpay{
  background:#f4c400;
  color:#111;
}

.wave{
  background:#18a957;
  color:white;
}

.submit{
  background:#1769aa;
  color:white;
}

input,select{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

.note{
  font-size:13px;
  color:#777;
  line-height:1.6;
}

.paybox{
  display:none;
}

.success{
  display:none;
  background:#e7f8e9;
  color:#176b2c;
  padding:14px;
  border-radius:10px;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="header">
  <h2>💳 My Wallet</h2>
  <div>Credits ဝယ်ယူရန်</div>
</div>

<div class="container">

  <div class="balance">
    <small>လက်ကျန် Credits</small>
    <h1>0 Credits</h1>
  </div>

  <div class="card">

    <h3>💰 Credits ဝယ်ရန်</h3>

    <label>ဝယ်မည့် Credits</label>

    <select id="credits">
      <option value="1000">1,000 Credits</option>
      <option value="5000">5,000 Credits</option>
      <option value="10000">10,000 Credits</option>
      <option value="50000">50,000 Credits</option>
    </select>

    <button class="kpay" onclick="choose('KPay')">
      💛 KPay ဖြင့်ငွေပေးချေမည်
    </button>

    <button class="wave" onclick="choose('WavePay')">
      💚 WavePay ဖြင့်ငွေပေးချေမည်
    </button>

  </div>

  <div class="card paybox" id="box">

    <h3 id="title"></h3>

    <p class="note">
      ငွေပေးချေပြီးပါက ပြေစာပုံကို အောက်တွင်ထည့်ပေးပါ။
    </p>

    <label>ငွေပေးသူအမည်</label>

    <input
      id="sender"
      type="text"
      placeholder="အမည်"
    >

    <label>ပြေစာပုံ</label>

    <input
      id="receipt"
      type="file"
      accept="image/*"
    >

    <button class="submit" onclick="send()">
      📩 ငွေပေးချေမှု တင်မည်
    </button>

    <div class="success" id="ok">
      ✅ ပြေစာတင်ပြီးပါပြီ။ စစ်ဆေးပြီး Credits ထည့်ပေးပါမည်။
    </div>

  </div>

  <div class="card">

    <h3>🔒 လုံခြုံရေး</h3>

    <p class="note">
      KPay/WavePay PIN၊ Password၊ OTP များကို
      website ထဲ မထည့်ပါနှင့်။
    </p>

  </div>

</div>

<script>

let selectedPayment = "";

function choose(method){

  selectedPayment = method;

  document.getElementById("box").style.display = "block";

  document.getElementById("title").innerText =
    "💳 " + method + " ဖြင့် ငွေပေးချေခြင်း";

}

function send(){

  const sender =
    document.getElementById("sender").value.trim();

  const receipt =
    document.getElementById("receipt").files[0];

  if(!sender){

    alert("ငွေပေးသူအမည် ထည့်ပေးပါ");

    return;
  }

  if(!receipt){

    alert("ပြေစာပုံ ထည့်ပေးပါ");

    return;
  }

  document.getElementById("ok").style.display = "block";

}

</script>

</body>
  </html>
