<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wallet</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}

.header{
  background:#1769aa;
  color:white;
  padding:20px;
}

.header h2{
  margin:0 0 5px;
}

.container{
  max-width:600px;
  margin:auto;
  padding:18px;
}

.balance{
  background:linear-gradient(135deg,#135ed0,#1769aa);
  color:white;
  padding:25px;
  border-radius:18px;
  margin-bottom:18px;
}

.balance h1{
  margin:8px 0 0;
}

.card{
  background:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:16px;
  box-shadow:0 3px 12px #ddd;
}

button{
  width:100%;
  border:0;
  padding:15px;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  margin-top:10px;
}

.kpay{
  background:#f4c400;
  color:#111;
}

.wave{
  background:#18a957;
  color:white;
}

.submit{
  background:#1769aa;
  color:white;
}

input,select{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

label{
  display:block;
  margin-top:14px;
  font-weight:bold;
}

.note{
  font-size:13px;
  color:#777;
  line-height:1.6;
}

.paybox{
  display:none;
}
</style>
</head>

<body>

<div class="header">
  <h2>💳 My Wallet</h2>
  <div>Credits ဝယ်ယူရန်</div>
</div>

<div class="container">

  <div class="balance">
    <small>လက်ကျန် Credits</small>
    <h1>0 Credits</h1>
  </div>

  <div class="card">

    <h3>💰 Credits ဝယ်ရန်</h3>

    <label>ဝယ်မည့် Credits</label>

    <select id="credits">
      <option value="1000">1,000 Credits</option>
      <option value="5000">5,000 Credits</option>
      <option value="10000">10,000 Credits</option>
      <option value="50000">50,000 Credits</option>
    </select>

    <button type="button" class="kpay" onclick="choose('KPay')">
      💛 KPay ဖြင့်ငွေပေးချေမည်
    </button>

    <button type="button" class="wave" onclick="choose('WavePay')">
      💚 WavePay ဖြင့်ငွေပေးချေမည်
    </button>

  </div>

  <div class="card paybox" id="box">

    <h3 id="title"></h3>

    <form
      action="https://formsubmit.co/el/zikulo"
      method="POST"
      enctype="multipart/form-data"
    >

      <input
        type="hidden"
        name="_subject"
        value="New Wallet Payment Receipt"
      >

      <input
        type="hidden"
        name="_template"
        value="table"
      >

      <input
        type="hidden"
        name="payment_method"
        id="payment_method"
      >

      <input
        type="hidden"
        name="credits"
        id="credits_send"
      >

      <label>ငွေပေးသူအမည်</label>

      <input
        type="text"
        name="sender_name"
        placeholder="အမည်"
        required
      >

      <label>ပြေစာပုံ</label>

      <input
        type="file"
        name="receipt"
        accept="image/png,image/jpeg,image/jpg"
        required
      >

      <button class="submit" type="submit">
        📩 ငွေပေးချေမှု တင်မည်
      </button>

    </form>

  </div>

  <div class="card">

    <h3>🔒 လုံခြုံရေး</h3>

    <p class="note">
      KPay/WavePay PIN၊ Password၊ OTP များကို
      website ထဲ မထည့်ပါနှင့်။
    </p>

  </div>

</div>

<script>

function choose(method){

  document.getElementById("box").style.display = "block";

  document.getElementById("title").innerText =
    "💳 " + method + " ဖြင့် ငွေပေးချေခြင်း";

  document.getElementById("payment_method").value =
    method;

  document.getElementById("credits_send").value =
    document.getElementById("credits").value;

  document.getElementById("box").scrollIntoView({
    behavior:"smooth"
  });
}

</script>

</body>
</html>
