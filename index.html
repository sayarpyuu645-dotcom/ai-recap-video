<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wallet</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  color:#222;
}
.header{
  background:#1769aa;
  color:white;
  padding:20px;
}
.container{
  max-width:600px;
  margin:auto;
  padding:18px;
}
.card{
  background:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:16px;
  box-shadow:0 3px 12px #ddd;
}
button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  font-size:16px;
  font-weight:bold;
  margin-top:10px;
}
.kpay{background:#f4c400}
.wave{background:#18a957;color:white}
.submit{background:#1769aa;color:white}
input,select{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}
label{
  display:block;
  margin-top:14px;
  font-weight:bold;
}
#paymentBox{display:none}
</style>
</head>

<body>

<div class="header">
  <h2>💳 My Wallet</h2>
  <div>Credits ဝယ်ယူရန်</div>
</div>

<div class="container">

<div class="card">
<h3>💰 Credits ဝယ်ရန်</h3>

<label>ဝယ်မည့် Credits</label>

<select id="credits">
<option value="1000">1,000 Credits</option>
<option value="5000">5,000 Credits</option>
<option value="10000">10,000 Credits</option>
<option value="50000">50,000 Credits</option>
</select>

<button type="button" class="kpay" onclick="selectPayment('KPay')">
💛 KPay
</button>

<button type="button" class="wave" onclick="selectPayment('WavePay')">
💚 WavePay
</button>

</div>

<div class="card" id="paymentBox">

<h3 id="paymentTitle"></h3>

<form
action="https://formsubmit.co/el/zikulo"
method="POST"
enctype="multipart/form-data"
>

<input type="hidden"
name="_subject"
value="New Wallet Payment Receipt">

<input type="hidden"
name="_template"
value="table">

<input type="hidden"
name="payment_method"
id="paymentMethod">

<input type="hidden"
name="credits"
id="creditsValue">

<label>ငွေပေးသူအမည်</label>

<input
type="text"
name="sender_name"
placeholder="အမည်"
required>

<label>ငွေလွှဲပြေစာပုံ</label>

<input
type="file"
name="receipt"
accept="image/png,image/jpeg,image/jpg"
required>

<button class="submit" type="submit">
📩 ပြေစာတင်မည်
</button>

</form>

</div>

<div class="card">
<h3>🔒 လုံခြုံရေး</h3>

<p>
KPay/WavePay PIN၊ Password၊ OTP များကို
website ထဲ မထည့်ပါနှင့်။
</p>
</div>

</div>

<script>

function selectPayment(method){

document.getElementById("paymentBox").style.display="block";

document.getElementById("paymentTitle").innerText =
"💳 "+method+" ဖြင့် ငွေပေးချေခြင်း";

document.getElementById("paymentMethod").value =
method;

document.getElementById("creditsValue").value =
document.getElementById("credits").value;

document.getElementById("paymentBox").scrollIntoView({
behavior:"smooth"
});

}

</script>

</body>
</html>
